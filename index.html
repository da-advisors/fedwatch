<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FedWatch | Federal Comment Deadlines &amp; Executive Actions</title>
<meta name="description" content="Track federal data collection opportunities, public comment deadlines, and executive actions.">
<meta name="theme-color" content="#1a3952">
<meta property="og:title" content="FedWatch">
<meta property="og:description" content="Federal comment deadlines and executive actions, in one place.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png">
<link rel="icon" href="assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===========================================================================
   Design tokens. Change a value here and it propagates everywhere — the rest
   of the stylesheet is written against these names, never raw hex.
   4px radius and spacing base; PT Sans for headings, Merriweather for body.
   =========================================================================== */
:root {
  --blue-10:#08131b; --blue-20:#112637; --blue-30:#1a3952; --blue-40:#234c6e;
  --blue-50:#2c608a; --blue-60:#547ea0; --blue-70:#7c9cb6; --blue-80:#a4bacc;
  --blue-90:#ccd8e2; --blue-bright:#1881e2;

  --gray-05:#0e0e0e; --gray-20:#303030; --gray-30:#484848; --gray-40:#606060;
  --gray-50:#787878; --gray-70:#ababab; --gray-80:#c4c4c4; --gray-90:#dedede;
  --gray-95:#fafafa;

  --red-40:#900707;    --red-90:#edc3c3;
  --green-50:#186429;  --green-90:#c7d9cb;
  --yellow-20:#664d02; --yellow-90:#fff0c3;
  --orange-30:#993d04; --orange-90:#ffe4c3;

  --page-bg:#f5f5f5; --surface:#fff; --surface-alt:#f8f9fa;
  --ink:var(--gray-05); --ink-2:var(--gray-30); --ink-muted:var(--gray-40);
  --hairline:var(--gray-90);
  --link:var(--blue-50); --link-hover:var(--blue-bright);

  --font-heading:"PT Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:"Merriweather", Georgia, serif;

  --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --shadow-card:0 1px 2px rgba(14,14,14,.06);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--page-bg); color:var(--ink);
  font-family:var(--font-body); font-weight:300; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3 { font-family:var(--font-heading); font-weight:700; }
a { color:var(--link); transition:color .2s ease; }
a:hover { color:var(--link-hover); }
:focus-visible { outline:3px solid var(--blue-bright); outline-offset:2px; }

/* ------------------------------------------------------------------ header */
.site-header { position:sticky; top:0; z-index:100; background:var(--blue-30); color:#fff; box-shadow:0 1px 4px rgba(8,19,27,.25); }
.site-header__wrapper { max-width:1500px; margin:0 auto; padding:var(--sp-2) var(--sp-4) 0; }
.site-header__bar { display:flex; align-items:center; gap:var(--sp-3); padding-bottom:var(--sp-2); }
.site-header__logo { display:flex; align-items:center; gap:var(--sp-3); color:#fff; text-decoration:none; }
.site-header__logo img { height:40px; width:auto; display:block; }
.site-header__wordmark { font-family:var(--font-heading); font-weight:700; font-size:22px; line-height:1; }
.site-header__tagline { display:block; font-family:var(--font-heading); font-weight:400; font-size:12px; color:var(--blue-90); margin-top:3px; }

/* tabs */
.tabs { display:flex; gap:var(--sp-1); }
.tab {
  font-family:var(--font-heading); font-weight:700; font-size:14px;
  letter-spacing:.03em; text-transform:uppercase;
  background:none; border:none; border-bottom:3px solid transparent;
  color:var(--blue-90); padding:var(--sp-3) var(--sp-4); cursor:pointer;
  display:flex; align-items:center; gap:var(--sp-2); white-space:nowrap;
}
.tab:hover { color:#fff; }
.tab[aria-selected="true"] { color:#fff; border-bottom-color:#fff; }
.tab__count {
  font-size:12px; font-weight:700; background:rgba(255,255,255,.15);
  color:#fff; border-radius:999px; padding:2px 8px; letter-spacing:0;
}

/* -------------------------------------------------------------------- page */
.site-content { max-width:1500px; margin:0 auto; padding:var(--sp-8) var(--sp-4) var(--sp-10); }
.page-head { margin-bottom:var(--sp-6); }
.page-head h1 { font-size:32px; line-height:1.15; }
.page-head p { color:var(--ink-2); margin-top:var(--sp-1); font-size:15px; }
.page-head .updated { font-family:var(--font-heading); font-size:13px; color:var(--ink-muted); margin-top:var(--sp-2); }

/* ------------------------------------------------------------- stat strip */
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--sp-3); margin-bottom:var(--sp-5); }
.stat { background:var(--surface); border:1px solid var(--hairline); border-top:3px solid var(--blue-50);
        border-radius:var(--radius-md); padding:var(--sp-4); box-shadow:var(--shadow-card); }
.stat--urgent { border-top-color:var(--red-40); }
.stat__label { font-family:var(--font-heading); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); }
.stat__value { font-family:var(--font-heading); font-weight:700; font-size:30px; line-height:1.1; margin-top:2px; }
.stat__value.is-urgent { color:var(--red-40); }
.stat__note { font-size:13px; color:var(--ink-2); margin-top:2px; }

/* ----------------------------------------------------------------- toolbar */
.toolbar { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-md);
           box-shadow:var(--shadow-card); padding:var(--sp-4); margin-bottom:var(--sp-4);
           display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-family:var(--font-heading); font-weight:700; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); }
.field select, .field input {
  font-family:var(--font-heading); font-size:15px; color:var(--ink);
  background:var(--surface); border:1px solid var(--gray-80);
  border-radius:var(--radius-sm); padding:9px 11px; min-width:190px;
}
.field select:hover, .field input:hover { border-color:var(--blue-50); }
.field.grow { flex:1 1 240px; }
.field.grow input { width:100%; min-width:0; }
.btn { font-family:var(--font-heading); font-weight:700; font-size:14px; border-radius:var(--radius-sm);
       padding:9px 16px; cursor:pointer; border:1px solid var(--gray-80);
       background:var(--surface); color:var(--ink-2); white-space:nowrap; }
.btn:hover { background:var(--surface-alt); border-color:var(--blue-50); color:var(--blue-50); }
.btn--primary { background:var(--blue-50); border-color:var(--blue-50); color:#fff; }
.btn--primary:hover { background:var(--blue-40); border-color:var(--blue-40); color:#fff; }

.result-line { font-family:var(--font-heading); font-size:14px; color:var(--ink-2); margin:0 2px var(--sp-3); }

/* ------------------------------------------------------------------ banner */
.banner { display:none; gap:var(--sp-3); align-items:center; flex-wrap:wrap;
          border-radius:var(--radius-md); padding:var(--sp-4); margin-bottom:var(--sp-4); font-size:15px;
          background:var(--blue-90); color:var(--blue-20); border-left:4px solid var(--blue-50); }
.banner.is-error { background:var(--red-90); color:var(--red-40); border-left-color:var(--red-40); }

/* ------------------------------------------------------------------- table */
.table-card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-md);
              box-shadow:var(--shadow-card); overflow:hidden; }
.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }

/* top:0, not an offset — .table-scroll's overflow-x makes it the scroll
   container, so any positive `top` shifts the header down over row 1. */
thead th { position:sticky; top:0; z-index:2; background:var(--blue-30); color:#fff;
           font-family:var(--font-heading); font-weight:700; font-size:12px;
           letter-spacing:.06em; text-transform:uppercase; text-align:left;
           padding:12px var(--sp-4); white-space:nowrap; }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { background:var(--blue-40); }
th .arrow { display:inline-block; width:10px; margin-left:5px; font-size:9px; opacity:0; }
th.sortable:hover .arrow { opacity:.55; }
th.sort-asc .arrow, th.sort-desc .arrow { opacity:1; }

tbody td { padding:var(--sp-4); border-bottom:1px solid var(--hairline); vertical-align:top; font-size:15px; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:nth-child(even) { background:var(--surface-alt); }
tbody tr:hover { background:var(--blue-90); }

.col-date { white-space:nowrap; width:1%; }
.date-main { font-family:var(--font-heading); font-weight:700; font-size:15px; }
.date-sub { font-family:var(--font-heading); font-size:12.5px; color:var(--ink-muted); margin-top:3px; }

.pill { display:inline-flex; align-items:center; gap:5px; font-family:var(--font-heading);
        font-weight:700; font-size:12.5px; line-height:1; padding:5px 10px 5px 8px;
        border-radius:999px; margin-top:6px; white-space:nowrap; }
.pill__glyph { font-size:11px; }
.pill--critical { background:var(--red-90);    color:var(--red-40); }
.pill--serious  { background:var(--orange-90); color:var(--orange-30); }
.pill--warning  { background:var(--yellow-90); color:var(--yellow-20); }
.pill--good     { background:var(--green-90);  color:var(--green-50); }
.pill--closed   { background:var(--gray-90);   color:var(--gray-30); }

.col-title { min-width:300px; max-width:440px; }
.title-text { font-family:var(--font-heading); font-weight:700; font-size:15.5px; line-height:1.35; }
a.title-text { text-decoration:none; }
a.title-text:hover { text-decoration:underline; }
.tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--sp-2); }
.tag { font-family:var(--font-heading); font-size:12.5px; padding:3px 9px; border-radius:var(--radius-sm);
       background:var(--gray-95); color:var(--ink-2); border:1px solid var(--gray-80); white-space:nowrap; }
.tag--agency { background:var(--blue-90); color:var(--blue-20); border-color:var(--blue-80); }

.col-text { min-width:240px; max-width:460px; color:var(--ink-2); font-size:14px; }
.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
tr.is-open .clamp { -webkit-line-clamp:unset; overflow:visible; }
.expand { background:none; border:none; padding:var(--sp-1) 0 0; font-family:var(--font-heading);
          font-weight:700; font-size:12.5px; color:var(--link); cursor:pointer; }
.expand:hover { color:var(--link-hover); text-decoration:underline; }
.na { color:var(--gray-70); }

.empty { padding:64px var(--sp-6); text-align:center; }
.empty h3 { font-size:19px; margin-bottom:var(--sp-1); }
.empty p { color:var(--ink-2); font-size:15px; }
.loading { padding:64px; text-align:center; color:var(--ink-muted); font-family:var(--font-heading); }

/* -------------------------------------------------------------- pagination */
.pagination { display:flex; justify-content:center; align-items:center; gap:6px; padding:var(--sp-4);
              flex-wrap:wrap; border-top:1px solid var(--hairline); }
.pagination button { font-family:var(--font-heading); font-size:15px; min-width:38px; height:38px;
                     padding:0 11px; border-radius:var(--radius-sm); border:1px solid var(--gray-80);
                     background:var(--surface); color:var(--ink-2); cursor:pointer; }
.pagination button:hover:not(:disabled) { border-color:var(--blue-50); color:var(--blue-50); }
.pagination button[aria-current="page"] { background:var(--blue-30); border-color:var(--blue-30); color:#fff; font-weight:700; }
.pagination button:disabled { opacity:.4; cursor:default; }
.pagination .gap { color:var(--gray-70); padding:0 2px; }

/* ------------------------------------------------------------------ footer */
.site-footer { background:var(--blue-20); color:#fff; text-align:center; padding:var(--sp-10) var(--sp-4); font-size:13.5px; }
.site-footer a { color:var(--blue-90); }
.site-footer a:hover { color:#fff; }
.site-footer__inner { max-width:1500px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }

/* -------------------------------------------------------------- responsive */
@media (max-width:1100px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }

@media (max-width:760px) {
  .site-content { padding:var(--sp-5) var(--sp-3) var(--sp-8); }
  .page-head h1 { font-size:26px; }
  .site-header__tagline { display:none; }
  .site-header__wrapper { padding-left:var(--sp-3); padding-right:var(--sp-3); }
  .tabs { overflow-x:auto; }
  .tab { padding:var(--sp-3) var(--sp-3); font-size:13px; }
  .stats { gap:var(--sp-2); }
  .stat__value { font-size:24px; }
  .field { flex:1 1 100%; }
  .field select, .field input { min-width:0; width:100%; }

  /* the table becomes stacked cards rather than a sideways scroll */
  thead { display:none; }
  table, tbody, tr, td { display:block; width:100%; }
  tbody tr { border-bottom:8px solid var(--page-bg); padding:var(--sp-4); }
  tbody tr:nth-child(even), tbody tr:hover { background:var(--surface); }
  tbody td { border:none; padding:0 0 var(--sp-2); max-width:none; }
  tbody td:last-child { padding-bottom:0; }
  td[data-label]:not(.col-date):not(.col-title)::before {
    content:attr(data-label); display:block; font-family:var(--font-heading);
    font-weight:700; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:3px;
  }
  .col-date { width:auto; display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
  .pill { margin-top:0; }
  .date-sub { width:100%; margin-top:0; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__wrapper">
    <div class="site-header__bar">
      <a class="site-header__logo" href="./">
        <img src="assets/logo-white.png" alt="" width="40" height="44">
        <span>
          <span class="site-header__wordmark">FedWatch</span>
          <span class="site-header__tagline">Federal comment deadlines and executive actions</span>
        </span>
      </a>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<main class="site-content">
  <div class="page-head">
    <h1 id="pageTitle">Loading…</h1>
    <p id="pageBlurb"></p>
    <p class="updated" id="lastUpdated"></p>
  </div>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <div class="banner" id="banner" role="status"></div>

<script>
/* ---------------------------------------------------------------------------
   Data sources.

   Over http(s) — GitHub Pages, a custom domain, a local server — the relative
   path is used. Opened as a file:// URL (double-clicked from Finder) browsers
   refuse relative fetches, so we fall back to GitHub's raw endpoint, which
   sends permissive CORS headers and works from anywhere.
   --------------------------------------------------------------------------- */
const RAW_BASE = 'https://raw.githubusercontent.com/da-advisors/fedwatch/main/';
const PER_PAGE = 25;

/* --------------------------------------------------------------- formatting */
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }

function parseDate(raw) {
  if (raw == null || String(raw).trim() === '') return null;
  const s = String(raw).trim();
  // Plain YYYY-MM-DD is parsed as UTC by Date, which shifts a day in western
  // timezones. Build it as a local date instead.
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  return isNaN(d) ? null : d;
}
function daysUntil(raw) {
  const d = parseDate(raw);
  if (!d) return null;
  d.setHours(0,0,0,0);
  return Math.round((d - today()) / 86400000);
}
function formatDate(raw) {
  const d = parseDate(raw);
  return d ? d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : null;
}
// Only http(s) links out of the spreadsheet — blocks javascript: and data: URLs.
function safeUrl(raw) {
  if (!raw) return null;
  try {
    const u = new URL(String(raw).trim(), window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
  } catch { return null; }
}
function text(raw) {
  if (raw == null) return '';
  const s = String(raw).trim();
  return (s === '' || ['nan','none','na','n/a'].includes(s.toLowerCase())) ? '' : s;
}

/* Deadline state. Colour is reinforcement only — the glyph and the words carry
   the meaning, so it survives greyscale, print, and colourblind readers. */
function deadlineState(raw) {
  const n = daysUntil(raw);
  if (n === null) return { cls:'pill--closed',   glyph:'–', label:'No comment period' };
  if (n < 0)      return { cls:'pill--closed',   glyph:'×', label:`Closed ${Math.abs(n)} ${Math.abs(n)===1?'day':'days'} ago` };
  if (n === 0)    return { cls:'pill--critical', glyph:'!', label:'Due today' };
  if (n <= 7)     return { cls:'pill--critical', glyph:'!', label:`${n} ${n===1?'day':'days'} left` };
  if (n <= 14)    return { cls:'pill--serious',  glyph:'▲', label:`${n} days left` };
  if (n <= 30)    return { cls:'pill--warning',  glyph:'•', label:`${n} days left` };
  return            { cls:'pill--good',      glyph:'•', label:`${n} days left` };
}

/* --------------------------------------------------------------- DOM makers */
function na() { const s = document.createElement('span'); s.className = 'na'; s.textContent = '—'; return s; }

function tagEl(value, cls) {
  const t = document.createElement('span');
  t.className = 'tag' + (cls ? ' ' + cls : '');
  t.textContent = value;
  return t;
}

function titleCell(row, td) {
  const title = text(row['Title']) || 'Untitled';
  const href = safeUrl(row['URL']);
  // Built with DOM APIs, never innerHTML — a title containing markup renders
  // as text instead of becoming part of the page.
  const el = document.createElement(href ? 'a' : 'span');
  el.className = 'title-text';
  el.textContent = title;
  if (href) { el.href = href; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
  td.appendChild(el);

  const listing = text(row['Listing Type']);
  if (listing) {
    const wrap = document.createElement('div');
    wrap.className = 'tag-row';
    wrap.appendChild(tagEl(listing));
    td.appendChild(wrap);
  }
}

function clampCell(value, td, tr) {
  const v = text(value);
  if (!v) { td.appendChild(na()); return; }
  const p = document.createElement('div');
  p.className = 'clamp';
  p.textContent = v;
  td.appendChild(p);
  if (v.length > 150) {                     // only when it actually clips
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'expand'; btn.textContent = 'Show more';
    btn.addEventListener('click', () => {
      const open = tr.classList.toggle('is-open');
      tr.querySelectorAll('.expand').forEach(b => { b.textContent = open ? 'Show less' : 'Show more'; });
    });
    td.appendChild(btn);
  }
}

/* ---------------------------------------------------------------------------
   Dataset definitions. Each tab declares its own file, columns, filters, and
   summary tiles; everything below this block is generic.
   --------------------------------------------------------------------------- */
const DATASETS = {
  fedwatch: {
    label: 'Comment deadlines',
    file: 'data/fedwatch.json',
    title: 'Open for comment',
    blurb: 'Federal rules, notices, and requests for information — with the deadline to submit a public comment.',
    sortColumn: 'Due Date',
    sortOrder: 'asc',                       // soonest deadline first
    searchFields: ['Issue Date','Due Date','Title','URL','Agency','Listing Type','Main Issues','Summary of Oppty'],

    filters: [
      { id:'status', label:'Status', type:'select', default:'open',
        options: [
          { value:'open',   label:'Open for comment' },
          { value:'closed', label:'Closed' },
          { value:'none',   label:'No comment period' },
          { value:'',       label:'All' },
        ],
        test: (row, v) => {
          const n = daysUntil(row['Due Date']);
          if (v === 'open')   return n !== null && n >= 0;
          if (v === 'closed') return n !== null && n < 0;
          if (v === 'none')   return n === null;
          return true;
        } },
      { id:'agency', label:'Agency', type:'field', field:'Agency', all:'All agencies' },
      { id:'issues', label:'Main issues', type:'field', field:'Main Issues', all:'All issues' },
    ],

    columns: [
      { key:'Due Date', label:'Deadline', sortable:true, cls:'col-date', render(row, td) {
          const d = document.createElement('div');
          d.className = 'date-main';
          d.textContent = formatDate(row['Due Date']) || 'No deadline';
          td.appendChild(d);

          const st = deadlineState(row['Due Date']);
          const pill = document.createElement('span');
          pill.className = `pill ${st.cls}`;
          const g = document.createElement('span');
          g.className = 'pill__glyph'; g.setAttribute('aria-hidden','true'); g.textContent = st.glyph;
          pill.append(g, document.createTextNode(st.label));
          td.appendChild(pill);

          const issued = formatDate(row['Issue Date']);
          if (issued) {
            const sub = document.createElement('div');
            sub.className = 'date-sub'; sub.textContent = `Issued ${issued}`;
            td.appendChild(sub);
          }
        } },
      { key:'Title', label:'Opportunity', sortable:true, cls:'col-title', render:(row, td) => titleCell(row, td) },
      { key:'Agency', label:'Agency', sortable:true, render(row, td) {
          const v = text(row['Agency']);
          td.appendChild(v ? tagEl(v, 'tag--agency') : na());
        } },
      { key:'Main Issues', label:'Main issues', sortable:true, cls:'col-text', render(row, td) {
          const v = text(row['Main Issues']);
          if (v) td.textContent = v; else td.appendChild(na());
        } },
      { key:'Summary of Oppty', label:'Summary', cls:'col-text', render:(row, td, tr) => clampCell(row['Summary of Oppty'], td, tr) },
    ],

    stats(all) {
      const open   = all.filter(r => { const n = daysUntil(r['Due Date']); return n !== null && n >= 0; });
      const urgent = open.filter(r => daysUntil(r['Due Date']) <= 7);
      const next   = open.map(r => ({ n: daysUntil(r['Due Date']), row: r })).sort((a,b) => a.n - b.n)[0];
      const issues = new Set(all.map(r => text(r['Main Issues'])).filter(Boolean));
      return [
        { label:'Open for comment', value:open.length, note:`of ${all.length} tracked` },
        { label:'Closing in 7 days', value:urgent.length, note:urgent.length ? 'needs attention' : 'nothing urgent', urgent:true },
        { label:'Next deadline', value:next ? (next.n === 0 ? 'Today' : `${next.n} days`) : '—',
          note:next ? (formatDate(next.row['Due Date']) || '') : 'none upcoming' },
        { label:'Issue areas', value:issues.size || '—', note:'across the dataset' },
      ];
    },
  },

  potuswatch: {
    label: 'Executive actions',
    file: 'data/potuswatch.json',
    title: 'Executive actions',
    blurb: 'Executive orders, proclamations, and presidential memoranda — newest first.',
    sortColumn: 'Issue Date',
    sortOrder: 'desc',                      // newest first
    searchFields: ['Issue Date','Title','URL','Listing Type','Main Issues','Summary of Oppty'],

    filters: [
      { id:'type',   label:'Type', type:'field', field:'Listing Type', all:'All types' },
      { id:'issues', label:'Main issues', type:'field', field:'Main Issues', all:'All issues' },
    ],

    columns: [
      { key:'Issue Date', label:'Issued', sortable:true, cls:'col-date', render(row, td) {
          const d = document.createElement('div');
          d.className = 'date-main';
          d.textContent = formatDate(row['Issue Date']) || 'No date';
          td.appendChild(d);
        } },
      { key:'Title', label:'Action', sortable:true, cls:'col-title', render:(row, td) => titleCell(row, td) },
      { key:'Main Issues', label:'Main issues', sortable:true, cls:'col-text', render(row, td) {
          const v = text(row['Main Issues']);
          if (v) td.textContent = v; else td.appendChild(na());
        } },
      { key:'Summary of Oppty', label:'Summary', cls:'col-text', render:(row, td, tr) => clampCell(row['Summary of Oppty'], td, tr) },
    ],

    stats(all) {
      const byType = t => all.filter(r => text(r['Listing Type']).toUpperCase() === t).length;
      const dated = all.map(r => parseDate(r['Issue Date'])).filter(Boolean).sort((a,b) => b - a);
      const issues = new Set(all.map(r => text(r['Main Issues'])).filter(Boolean));
      return [
        { label:'Actions tracked', value:all.length, note:'since Jan 2025' },
        { label:'Executive orders', value:byType('EO'), note:`plus ${all.length - byType('EO')} other actions` },
        { label:'Most recent', value:dated[0] ? formatDate(dated[0].toISOString().slice(0,10)) : '—', note:'latest action issued' },
        { label:'Issue areas', value:issues.size || '—', note:'across the dataset' },
      ];
    },
  },
};

/* ------------------------------------------------------------------- state */
let currentKey = 'fedwatch';
let cfg = DATASETS[currentKey];
const cache = {};                 // key -> records
let allData = [], filteredData = [];
let currentPage = 1;
let sortColumn = cfg.sortColumn, sortOrder = cfg.sortOrder;
let filterValues = {};

/* -------------------------------------------------------------------- tabs */
function renderTabs() {
  const wrap = document.getElementById('tabs');
  wrap.textContent = '';
  Object.entries(DATASETS).forEach(([key, d]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.role = 'tab';
    b.setAttribute('aria-selected', key === currentKey ? 'true' : 'false');
    b.textContent = d.label;
    if (cache[key]) {
      const c = document.createElement('span');
      c.className = 'tab__count'; c.textContent = cache[key].length;
      b.appendChild(c);
    }
    b.addEventListener('click', () => switchTo(key));
    wrap.appendChild(b);
  });
}

function switchTo(key, { push = true } = {}) {
  if (!DATASETS[key]) return;
  currentKey = key;
  cfg = DATASETS[key];
  sortColumn = cfg.sortColumn;
  sortOrder = cfg.sortOrder;
  currentPage = 1;
  filterValues = {};
  cfg.filters.forEach(f => { filterValues[f.id] = f.default || ''; });
  if (push && location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);

  document.getElementById('pageTitle').textContent = cfg.title;
  document.getElementById('pageBlurb').textContent = cfg.blurb;
  renderTabs();
  renderHead();
  loadCurrent();
}

/* --------------------------------------------------------------- data load */
async function loadCurrent() {
  const loadingEl = document.getElementById('loading');
  hideBanner();

  if (cache[currentKey]) {
    allData = cache[currentKey];
    loadingEl.style.display = 'none';
    buildToolbar();
    applyFilters();
    return;
  }

  loadingEl.style.display = 'block';
  document.getElementById('tbody').textContent = '';

  const openedAsFile = window.location.protocol === 'file:';
  const bust = `t=${Date.now()}`;
  const sources = openedAsFile
    ? [`${RAW_BASE}${cfg.file}?${bust}`]
    : [`${cfg.file}?${bust}`, `${RAW_BASE}${cfg.file}?${bust}`];
  const failures = [];

  for (const src of sources) {
    try {
      const res = await fetch(src, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();

      allData = Array.isArray(json.records) ? json.records : [];
      cache[currentKey] = allData;
      setLastUpdated(json.last_updated);
      loadingEl.style.display = 'none';
      renderTabs();
      buildToolbar();
      applyFilters();
      if (allData.length === 0) {
        showBanner('Nothing published for this view yet.');
      }
      preloadOthers();
      return;
    } catch (err) {
      failures.push(`${src.split('?')[0]} → ${err.message}`);
    }
  }

  console.error('Could not load data:', failures);
  loadingEl.style.display = 'none';
  allData = [];
  buildToolbar();
  applyFilters();
  showBanner(
    openedAsFile
      ? 'This page was opened straight from a file, so it can only read data already published to GitHub — and it could not reach it. Double-click serve.command in this folder to preview locally instead.'
      : `Could not load ${cfg.file}. Check that the file exists and contains valid JSON.`,
    'error'
  );
}

/* Quietly fetch the tabs the user hasn't opened, so their record counts show
   on the tab bar right away and switching is instant. Failures are ignored —
   this is decoration, and the real load path already reports its own errors. */
function preloadOthers() {
  Object.entries(DATASETS).forEach(([key, d]) => {
    if (cache[key]) return;
    const rel = window.location.protocol === 'file:' ? `${RAW_BASE}${d.file}` : d.file;
    fetch(rel, { cache:'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if (!json || !Array.isArray(json.records)) return;
        cache[key] = json.records;
        renderTabs();
      })
      .catch(() => {});
  });
}

function setLastUpdated(value) {
  const d = parseDate(value);
  document.getElementById('lastUpdated').textContent =
    d ? `Last updated ${d.toLocaleDateString(undefined,{ month:'long', day:'numeric', year:'numeric' })}` : '';
}

/* ------------------------------------------------------------------ banner */
function showBanner(message, kind = 'info') {
  const el = document.getElementById('banner');
  el.textContent = message;
  el.classList.toggle('is-error', kind === 'error');
  el.style.display = 'flex';
}
function hideBanner() { document.getElementById('banner').style.display = 'none'; }

/* ----------------------------------------------------------------- toolbar */
function buildToolbar() {
  const bar = document.getElementById('toolbar');
  bar.textContent = '';

  cfg.filters.forEach(f => {
    const field = document.createElement('div');
    field.className = 'field';
    const label = document.createElement('label');
    label.setAttribute('for', `filter-${f.id}`);
    label.textContent = f.label;
    const select = document.createElement('select');
    select.id = `filter-${f.id}`;

    if (f.type === 'select') {
      f.options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        select.appendChild(opt);
      });
    } else {
      const all = document.createElement('option');
      all.value = ''; all.textContent = f.all;
      select.appendChild(all);
      [...new Set(allData.map(r => text(r[f.field])).filter(Boolean))]
        .sort((a,b) => a.localeCompare(b))
        .forEach(v => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = v;
          select.appendChild(opt);
        });
    }
    select.value = filterValues[f.id] || '';
    select.addEventListener('change', () => { filterValues[f.id] = select.value; applyFilters(); });
    field.append(label, select);
    bar.appendChild(field);
  });

  const searchField = document.createElement('div');
  searchField.className = 'field grow';
  const searchLabel = document.createElement('label');
  searchLabel.setAttribute('for', 'searchInput');
  searchLabel.textContent = 'Search';
  const search = document.createElement('input');
  search.type = 'search'; search.id = 'searchInput';
  search.placeholder = 'Title, summary, issue area…';
  search.autocomplete = 'off';
  let timer;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(applyFilters, 180); });
  search.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); applyFilters(); } });
  searchField.append(searchLabel, search);
  bar.appendChild(searchField);

  const clear = document.createElement('button');
  clear.type = 'button'; clear.className = 'btn'; clear.textContent = 'Clear';
  clear.style.marginBottom = '9px';
  clear.addEventListener('click', () => {
    cfg.filters.forEach(f => {
      filterValues[f.id] = f.default || '';
      const el = document.getElementById(`filter-${f.id}`);
      if (el) el.value = filterValues[f.id];
    });
    document.getElementById('searchInput').value = '';
    applyFilters();
  });
  bar.appendChild(clear);
}

/* ----------------------------------------------------------------- filters */
function applyFilters() {
  const searchEl = document.getElementById('searchInput');
  const search = searchEl ? searchEl.value.trim().toLowerCase() : '';

  filteredData = allData.filter(row => {
    for (const f of cfg.filters) {
      const v = filterValues[f.id];
      if (f.type === 'select') {
        if (!f.test(row, v)) return false;
      } else if (v && text(row[f.field]) !== v) {
        return false;
      }
    }
    if (search) {
      const hay = cfg.searchFields.map(k => text(row[k])).join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  currentPage = 1;
  sortData();
  renderStats();
  renderTable();
}

/* -------------------------------------------------------------------- sort */
function sortData() {
  const dir = sortOrder === 'asc' ? 1 : -1;
  const isDate = sortColumn.includes('Date');
  filteredData.sort((a, b) => {
    if (isDate) {
      // Blank and unparseable dates always sink to the bottom, both directions.
      const da = parseDate(a[sortColumn]), db = parseDate(b[sortColumn]);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return (da - db) * dir;
    }
    const va = text(a[sortColumn]), vb = text(b[sortColumn]);
    if (!va && !vb) return 0;
    if (!va) return 1;
    if (!vb) return -1;
    return va.localeCompare(vb, undefined, { sensitivity:'base', numeric:true }) * dir;
  });
}

/* ------------------------------------------------------------------- stats */
function renderStats() {
  const wrap = document.getElementById('stats');
  wrap.textContent = '';
  cfg.stats(allData).forEach(s => {
    const card = document.createElement('div');
    card.className = 'stat' + (s.urgent ? ' stat--urgent' : '');
    const l = document.createElement('div'); l.className = 'stat__label'; l.textContent = s.label;
    const v = document.createElement('div');
    v.className = 'stat__value' + (s.urgent && s.value ? ' is-urgent' : '');
    v.textContent = s.value;
    const n = document.createElement('div'); n.className = 'stat__note'; n.textContent = s.note;
    card.append(l, v, n);
    wrap.appendChild(card);
  });
}

/* ------------------------------------------------------------ table header */
function renderHead() {
  const row = document.getElementById('theadRow');
  row.textContent = '';
  cfg.columns.forEach(col => {
    const th = document.createElement('th');
    th.scope = 'col';
    th.textContent = col.label;
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    th.appendChild(arrow);

    if (col.sortable) {
      th.className = 'sortable';
      th.tabIndex = 0;
      th.dataset.column = col.key;
      const activate = () => {
        if (sortColumn === col.key) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        else { sortColumn = col.key; sortOrder = col.key.includes('Date') ? 'desc' : 'asc'; }
        markSort();
        currentPage = 1;
        sortData();
        renderTable();
      };
      th.addEventListener('click', activate);
      th.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
    }
    row.appendChild(th);
  });
  markSort();
}

function markSort() {
  document.querySelectorAll('#theadRow th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    th.removeAttribute('aria-sort');
    const a = th.querySelector('.arrow');
    if (a) a.textContent = '';
    if (th.dataset.column === sortColumn) {
      th.classList.add(`sort-${sortOrder}`);
      th.setAttribute('aria-sort', sortOrder === 'asc' ? 'ascending' : 'descending');
      if (a) a.textContent = sortOrder === 'asc' ? '▲' : '▼';
    }
  });
}

/* ------------------------------------------------------------------- table */
function renderTable() {
  const tbody = document.getElementById('tbody');
  const start = (currentPage - 1) * PER_PAGE;
  const pageData = filteredData.slice(start, start + PER_PAGE);
  tbody.textContent = '';

  document.getElementById('resultLine').textContent =
    filteredData.length ? `Showing ${start + 1}–${start + pageData.length} of ${filteredData.length}` : '';
  document.getElementById('footerCount').textContent =
    allData.length ? `${allData.length} records in this view` : '';

  if (pageData.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = cfg.columns.length;
    const box = document.createElement('div');
    box.className = 'empty';
    const h = document.createElement('h3'), p = document.createElement('p');
    if (allData.length === 0) {
      h.textContent = 'Nothing published yet';
      p.textContent = 'Once data is published, records will appear here.';
    } else {
      h.textContent = 'No matches';
      p.textContent = 'Try a different filter, or set Status to “All”.';
    }
    box.append(h, p);
    td.appendChild(box);
    tr.appendChild(td);
    tbody.appendChild(tr);
    renderPagination();
    return;
  }

  pageData.forEach(row => {
    const tr = document.createElement('tr');
    cfg.columns.forEach(col => {
      const td = document.createElement('td');
      if (col.cls) td.className = col.cls;
      td.setAttribute('data-label', col.label);
      col.render(row, td, tr);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  renderPagination();
}

/* -------------------------------------------------------------- pagination */
function renderPagination() {
  const totalPages = Math.ceil(filteredData.length / PER_PAGE);
  const el = document.getElementById('pagination');
  el.textContent = '';
  if (totalPages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  const go = p => {
    currentPage = p;
    renderTable();
    document.querySelector('.table-card').scrollIntoView({ behavior:'smooth', block:'start' });
  };
  const mk = (label, page, opts = {}) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    if (opts.disabled) b.disabled = true;
    if (opts.current) b.setAttribute('aria-current','page');
    if (opts.aria) b.setAttribute('aria-label', opts.aria);
    if (!opts.disabled && !opts.current) b.addEventListener('click', () => go(page));
    return b;
  };

  el.appendChild(mk('‹', currentPage - 1, { disabled: currentPage === 1, aria:'Previous page' }));
  const wanted = [...new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1])]
    .filter(p => p >= 1 && p <= totalPages).sort((a,b) => a - b);
  let prev = 0;
  wanted.forEach(p => {
    if (p - prev > 1) {
      const gap = document.createElement('span');
      gap.className = 'gap'; gap.textContent = '…';
      el.appendChild(gap);
    }
    el.appendChild(mk(String(p), p, { current: p === currentPage }));
    prev = p;
  });
  el.appendChild(mk('›', currentPage + 1, { disabled: currentPage === totalPages, aria:'Next page' }));
}

/* -------------------------------------------------------------------- init */
window.addEventListener('hashchange', () => {
  const key = location.hash.slice(1);
  if (DATASETS[key] && key !== currentKey) switchTo(key, { push:false });
});

document.addEventListener('DOMContentLoaded', () => {
  const initial = DATASETS[location.hash.slice(1)] ? location.hash.slice(1) : 'fedwatch';
  switchTo(initial);
});
</script>
</body>
